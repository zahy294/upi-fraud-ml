[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-fraud-rings"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "pandas>=2.3", "pyarrow>=18", "scikit-learn>=1.7",
  "lightgbm>=4.5", "xgboost>=3.0", "catboost>=1.2", "PyYAML>=6", "psutil>=6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
